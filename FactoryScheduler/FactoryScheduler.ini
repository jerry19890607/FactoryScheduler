[Paths]
# 主檔資料庫路徑 (Master Data)
MasterDataPath=\\127.0.0.1\d$\FactoryScheduler\Schema\Factory_Scheduling_Schema_V4_3.xlsx

# 每日標準工單匯入監控資料夾
DailyOrderFolder=\\127.0.0.1\d$\FactoryScheduler\Orders\

# 抽件 (Pull) 工單匯入監控資料夾
PullOrderFolder=\\127.0.0.1\d$\FactoryScheduler\Pulls\

# 排程結果輸出與回寫資料夾 (供機台與 Leader UI 讀取)
OutputFolder=\\127.0.0.1\d$\FactoryScheduler\Output\

# 系統 Log (包含錯誤與排程歷史) 存放路徑
LogFolder=\\127.0.0.1\d$\Logs\


[TriggerSettings]
# 動態抽件 (Pull) 系統預設檢查時間點 (逗號分隔)
PullTriggerTimes=09:30,10:30,11:30,14:40,15:30

# 是否啟用資料夾熱監控 (1=啟用 FileSystemWatcher 即時攔截, 0=僅依上述時間觸發)
EnableFolderWatcher=1

# 讀取 Excel 檔案重試次數與延遲 (防範生管開啟檔案造成的 File Lock)
FileReadRetryCount=3
FileReadRetryDelayMs=1000


